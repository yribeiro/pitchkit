<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@pitchkit/core — SVG renderer smoke demo</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 1.5rem;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        align-items: start;
      }
      .panel h2 {
        font-size: 0.85rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #999;
        margin: 0 0 0.5rem;
      }
      .panel svg {
        max-width: 100%;
        height: auto;
        display: block;
      }

      #controls {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.25rem;
        margin: 0 0 1.5rem;
        padding: 0.85rem 1rem;
        background: #1b1b1b;
        border: 1px solid #333;
        border-radius: 6px;
      }
      #controls .field {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.8rem;
        color: #bbb;
      }
      #controls input[type="color"] {
        width: 1.6rem;
        height: 1.6rem;
        padding: 0;
        border: 1px solid #444;
        border-radius: 4px;
        background: none;
        cursor: pointer;
      }
      #controls input[type="range"] {
        width: 5rem;
      }
      #controls input[type="number"] {
        width: 3.5rem;
      }
      #controls select,
      #controls input[type="number"] {
        background: #111;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.15rem 0.3rem;
      }
      #controls button {
        font-size: 0.8rem;
        color: #eee;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.35rem 0.7rem;
        cursor: pointer;
      }
      #controls button:hover {
        background: #353535;
      }

      /* The renderer now ships its own default presentation via inline
         `style="fill: var(--pitch-surface, ...)"` etc. (Milestone 1) — no
         CSS is required for a themed pitch to render correctly. The rules
         below are an *optional* per-page retheme, proving the CSS-variable
         override path described in PRD §8.7 (per-chart override via the
         cascade): defining --pitch-* anywhere above a pitch in the DOM
         changes its colours with zero renderer changes. */
      #grid {
        --pitch-surface: #1a472a;
        --pitch-stripe: rgba(255, 255, 255, 0.05);
        --pitch-lines: rgba(255, 255, 255, 0.8);
      }
      .panel.print {
        --pitch-surface: #ffffff;
        --pitch-stripe: #f5f5f5;
        --pitch-lines: #222222;
        background: #ddd;
        border-radius: 4px;
        padding: 0.5rem;
      }

      /* Player-number labels painted by the Annotate layer — colour comes
         from the painter's themed default; this just sets typography,
         demonstrating the `className` styling escape hatch (PRD §8.7). */
      .demo-label {
        font-weight: 600;
        font-size: 9px;
        text-transform: uppercase;
      }

      /* Canvas heatmap (Milestone 1): stacked on top of the SVG pitch via
         plain CSS positioning. @pitchkit/core deliberately does NOT solve
         this compositing story itself (that's a consumer/@pitchkit/react
         concern) — this wiring is hand-rolled in the demo script, same
         spirit as the pass-network recipe above. */
      .heatmap-stack {
        position: relative;
      }
      .heatmap-stack svg {
        position: relative;
        z-index: 1;
      }
      .heatmap-canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        max-width: 100%;
        height: auto;
        opacity: 0.75;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1>@pitchkit/core SVG renderer — StatsBomb / Opta / UEFA × horizontal / vertical</h1>

    <!--
      Styling sandbox: the colour inputs just set --pitch-* CSS custom
      properties on #grid and take effect immediately, since the renderer
      already reads them via var(--pitch-surface, ...) at paint time — no
      re-render needed (PRD §8.7's CSS-cascade theming). Stripes/goal-type
      are baked into the SVG shapes themselves (not CSS), so those controls
      call renderAll() to rebuild every panel's Scene with the new
      PitchAppearance. The "uefa — print theme" panel intentionally ignores
      these controls: its --pitch-* vars are scoped on .panel.print, which
      is more specific than #grid, demonstrating the per-chart override
      from the same cascade. The heatmap dropdown swaps the shot-heatmap
      panel's colorMin/colorMax and re-renders — HEATMAP_COLORMAPS in the
      script includes mplsoccer's "Pearl Earring" and "Flamingo" colormaps
      ported verbatim (same hex stops), alongside the library's own default.
    -->
    <div id="controls">
      <label class="field">Surface <input type="color" id="ctrl-surface" value="#1a472a" /></label>
      <label class="field">
        Stripe
        <input type="color" id="ctrl-stripe" value="#ffffff" />
        <input type="range" id="ctrl-stripe-opacity" min="0" max="1" step="0.01" value="0.05" />
      </label>
      <label class="field">
        Lines
        <input type="color" id="ctrl-lines" value="#ffffff" />
        <input type="range" id="ctrl-lines-opacity" min="0" max="1" step="0.01" value="0.8" />
      </label>
      <label class="field">
        <input type="checkbox" id="ctrl-stripes-enabled" checked />
        Stripes
      </label>
      <label class="field">
        Count
        <input type="number" id="ctrl-stripe-count" min="2" max="24" step="2" value="12" />
      </label>
      <label class="field">
        Goal type
        <select id="ctrl-goal-type">
          <option value="line">line</option>
          <option value="box" selected>box</option>
        </select>
      </label>
      <label class="field">
        Heatmap
        <select id="ctrl-heatmap-colormap">
          <option value="default" selected>default (blue → red)</option>
          <option value="pearlEarring">pearl earring</option>
          <option value="flamingo">flamingo</option>
        </select>
      </label>
      <button id="ctrl-reset" type="button">Reset</button>
    </div>

    <div id="grid"></div>

    <!--
      This imports the built ESM output directly (no bundler), so:
        1. Run `npm run build` in packages/core first.
        2. Serve this directory over HTTP — browsers block ES module
           imports over file://. e.g. from packages/core/examples:
             npx serve .
           or:
             python3 -m http.server 8080
    -->
    <script type="module">
      import {
        renderSceneToSVGElement,
        renderHeatmapLayersToCanvas,
        getPitchDimensions,
        createStandardizeTransform,
        cropForHalf,
      } from "../dist/index.js";

      const pitchTypes = ["statsbomb", "opta", "uefa"];
      const orientations = ["horizontal", "vertical"];

      // Sample "match objects" defined once, in StatsBomb's native
      // coordinates — a simple back-four-plus-forward diagram.
      // createStandardizeTransform converts them into each pitch type's own
      // coordinate system below, so the same logical positions line up
      // correctly regardless of origin/yDirection/grid-size differences.
      // Layer x/y accessors then read straight off the *standardized*
      // [x, y] tuples — layer coordinates are always in the scene's own
      // provider system (Milestone 1 architecture note).
      const statsbombDims = getPitchDimensions("statsbomb");
      const players = [
        { name: "GK", pos: [20, 40] },
        { name: "LB", pos: [35, 15] },
        { name: "RB", pos: [35, 65] },
        { name: "CB", pos: [35, 40] },
        { name: "CM", pos: [60, 40] },
        { name: "FW", pos: [90, 25] },
      ];
      const shot = [108, 36];

      /** Builds the Scatter + Annotate layers for one target pitch type. */
      function buildLayers(dimensions) {
        const standardize = createStandardizeTransform(statsbombDims, dimensions);
        const playersStd = players.map((p) => ({ ...p, pos: standardize(p.pos) }));
        const shotStd = standardize(shot);

        return [
          {
            type: "scatter",
            data: playersStd,
            x: (d) => d.pos[0],
            y: (d) => d.pos[1],
            r: 5,
            fill: "var(--pitch-marker-primary, #3b82f6)",
            stroke: "white",
            strokeWidth: 1,
          },
          {
            type: "scatter",
            data: [{ pos: shotStd }],
            x: (d) => d.pos[0],
            y: (d) => d.pos[1],
            r: 6,
            fill: "var(--pitch-marker-goal, #f97316)",
            stroke: "white",
            strokeWidth: 1,
          },
          {
            type: "annotate",
            data: playersStd,
            x: (d) => d.pos[0],
            y: (d) => d.pos[1],
            label: (d) => d.name,
            offsetY: -10,
            className: "demo-label",
          },
        ];
      }

      // Edges for a tiny pass network, reusing the same six named
      // positions — feeds both the Arrows panel (directional passes) and
      // the Comet panel (tapered, fading lines).
      const passNetworkEdges = [
        ["GK", "CB"],
        ["CB", "LB"],
        ["CB", "RB"],
        ["LB", "CM"],
        ["RB", "CM"],
        ["CM", "FW"],
      ];

      /** Arrows + Scatter + Annotate composed into a small pass-network recipe (PRD §7.4). */
      function buildPassNetworkLayers(dimensions) {
        const standardize = createStandardizeTransform(statsbombDims, dimensions);
        const nodesStd = players.map((p) => ({ ...p, pos: standardize(p.pos) }));
        const nodeByName = Object.fromEntries(nodesStd.map((n) => [n.name, n]));
        const edges = passNetworkEdges.map(([from, to]) => ({
          from: nodeByName[from].pos,
          to: nodeByName[to].pos,
        }));

        return [
          {
            type: "arrows",
            data: edges,
            x: (d) => d.from[0],
            y: (d) => d.from[1],
            x2: (d) => d.to[0],
            y2: (d) => d.to[1],
            strokeOpacity: 0.5,
            headSize: 5,
          },
          {
            type: "scatter",
            data: nodesStd,
            x: (d) => d.pos[0],
            y: (d) => d.pos[1],
            r: 7,
            stroke: "white",
            strokeWidth: 2,
          },
          {
            type: "annotate",
            data: nodesStd,
            x: (d) => d.pos[0],
            y: (d) => d.pos[1],
            label: (d) => d.name,
            offsetY: -14,
            className: "demo-label",
          },
        ];
      }

      /** A single CometLayer with gradient fade-in, reusing the same pass-network edges. */
      function buildCometLayers(dimensions) {
        const standardize = createStandardizeTransform(statsbombDims, dimensions);
        const posByName = Object.fromEntries(players.map((p) => [p.name, standardize(p.pos)]));
        const edges = passNetworkEdges.map(([from, to]) => ({
          from: posByName[from],
          to: posByName[to],
        }));

        return [
          {
            type: "comet",
            data: edges,
            x: (d) => d.from[0],
            y: (d) => d.from[1],
            x2: (d) => d.to[0],
            y2: (d) => d.to[1],
            gradient: true,
            startWidth: 0.5,
            endWidth: 5,
          },
        ];
      }

      // Synthetic shot locations, in StatsBomb's native coordinates — mostly
      // clustered around the box (to give the heatmap an obvious hot zone),
      // with a few midfield touches for contrast. Deterministic (not random)
      // so the demo is reproducible.
      const shotLocations = [
        [95, 35],
        [98, 40],
        [101, 38],
        [104, 42],
        [96, 44],
        [110, 39],
        [112, 41],
        [108, 36],
        [99, 45],
        [102, 33],
        [105, 46],
        [97, 37],
        [103, 40],
        [100, 43],
        [109, 38],
        [60, 40],
        [65, 35],
        [55, 45],
        [70, 42],
      ];

      // Selectable heatmap colormaps. "pearlEarring" and "flamingo" are
      // ported verbatim (same hex stops) from mplsoccer's own gallery
      // example: https://mplsoccer.readthedocs.io/en/latest/gallery/pitch_plots/plot_cmap.html
      // — LinearSegmentedColormap.from_list(['#15242e', '#4393c4']) and
      // (['#e3aca7', '#c03a1d']) respectively. mplsoccer builds an N-color
      // stepped colormap via matplotlib; createColorScale here is a
      // continuous 2-stop linear interpolation instead (see colormap.ts),
      // so the gradient is smoother, but the two endpoint colors match
      // exactly.
      const HEATMAP_COLORMAPS = {
        default: { colorMin: "#1d4ed8", colorMax: "#facc15" },
        pearlEarring: { colorMin: "#15242e", colorMax: "#4393c4" },
        flamingo: { colorMin: "#e3aca7", colorMax: "#c03a1d" },
      };
      let heatmapColormap = HEATMAP_COLORMAPS.default;

      /**
       * A <canvas> heatmap stacked on top of the SVG pitch (Milestone 1's
       * "Binned Heatmap (Canvas path)" item). renderHeatmapLayersToCanvas
       * only paints heatmap-type layers — the SVG scene below carries the
       * pitch itself plus a light scatter of the raw shot locations, so you
       * can see both the raw data and how it aggregates into bins.
       */
      function buildHeatmapStack(dimensions, viewport) {
        const standardize = createStandardizeTransform(statsbombDims, dimensions);
        const shotsStd = shotLocations.map((pos) => ({ pos: standardize(pos) }));

        const scatterLayer = {
          type: "scatter",
          data: shotsStd,
          x: (d) => d.pos[0],
          y: (d) => d.pos[1],
          r: 2,
          fill: "white",
          fillOpacity: 0.7,
        };
        const svg = renderSceneToSVGElement({
          dimensions,
          viewport,
          appearance,
          layers: [scatterLayer],
        });

        const heatmapLayer = {
          type: "heatmap",
          data: shotsStd,
          x: (d) => d.pos[0],
          y: (d) => d.pos[1],
          binsX: 8,
          binsY: 6,
          colorMin: heatmapColormap.colorMin,
          colorMax: heatmapColormap.colorMax,
        };
        const canvas = document.createElement("canvas");
        canvas.className = "heatmap-canvas";
        renderHeatmapLayersToCanvas({ dimensions, viewport, layers: [heatmapLayer] }, canvas);

        const stack = document.createElement("div");
        stack.className = "heatmap-stack";
        stack.append(svg, canvas);
        return stack;
      }

      const grid = document.getElementById("grid");

      function addPanel(label, svg, extraClass) {
        const panel = document.createElement("div");
        panel.className = extraClass ? `panel ${extraClass}` : "panel";

        const heading = document.createElement("h2");
        heading.textContent = label;

        panel.append(heading, svg);
        grid.appendChild(panel);
        return panel;
      }

      // Renderer styling/appearance demo (Milestone 1): grass stripes +
      // box-style goal frames, painted entirely by the renderer's own
      // CSS-variable defaults — no per-shape CSS required. Mutated by the
      // controls below and re-rendered via renderAll(), since stripes/
      // goalType are baked into the SVG shapes at paint time (not CSS).
      const appearance = { stripes: true, goalType: "box" };

      /** Clears #grid and rebuilds every demo panel from the current `appearance`. */
      function renderAll() {
        grid.replaceChildren();

        for (const pitchType of pitchTypes) {
          for (const orientation of orientations) {
            const dimensions = getPitchDimensions(pitchType);
            const viewport =
              orientation === "horizontal"
                ? { width: 420, height: 280, orientation }
                : { width: 280, height: 420, orientation };

            const layers = buildLayers(dimensions);
            const svg = renderSceneToSVGElement({ dimensions, viewport, appearance, layers });

            addPanel(`${pitchType} — ${orientation}`, svg);
          }
        }

        // `half` convenience: cropForHalf() crops the viewport to the
        // attacking (right) half in provider coordinates — one call, no
        // manual crop-window math.
        {
          const dimensions = getPitchDimensions("statsbomb");
          const viewport = {
            width: 320,
            height: 280,
            orientation: "horizontal",
            crop: cropForHalf(dimensions),
          };
          const layers = buildLayers(dimensions);
          const svg = renderSceneToSVGElement({ dimensions, viewport, appearance, layers });
          addPanel("statsbomb — half (cropForHalf)", svg);
        }

        // Per-chart theme override (PRD §8.7): scoping --pitch-* variables
        // on a wrapper element retheme the renderer's output via the CSS
        // cascade — no prop, no provider, no renderer change. Deliberately
        // not driven by the controls above (see comment near #controls).
        {
          const dimensions = getPitchDimensions("uefa");
          const viewport = { width: 320, height: 220, orientation: "horizontal" };
          const layers = buildLayers(dimensions);
          const svg = renderSceneToSVGElement({ dimensions, viewport, appearance, layers });
          addPanel("uefa — print theme (CSS var override)", svg, "print");
        }

        // Arrows: directional pass-network edges with arrowheads.
        {
          const dimensions = getPitchDimensions("statsbomb");
          const viewport = { width: 420, height: 280, orientation: "horizontal" };
          const layers = buildPassNetworkLayers(dimensions);
          const svg = renderSceneToSVGElement({ dimensions, viewport, appearance, layers });
          addPanel("statsbomb — pass network (arrows)", svg);
        }

        // Comet lines: tapered, gradient-faded edges — same data as the
        // pass-network panel above, painted as CometLayer instead of Arrows.
        {
          const dimensions = getPitchDimensions("statsbomb");
          const viewport = { width: 420, height: 280, orientation: "horizontal" };
          const layers = buildCometLayers(dimensions);
          const svg = renderSceneToSVGElement({ dimensions, viewport, appearance, layers });
          addPanel("statsbomb — comet lines (gradient)", svg);
        }

        // Canvas heatmap: a <canvas> stacked on top of the SVG pitch via
        // plain CSS (see .heatmap-stack above) — the human-verifiable
        // acceptance bar for Milestone 1's Canvas heatmap item.
        {
          const dimensions = getPitchDimensions("statsbomb");
          const viewport = { width: 420, height: 280, orientation: "horizontal" };
          const stack = buildHeatmapStack(dimensions, viewport);
          addPanel("statsbomb — shot heatmap (canvas + svg, stacked)", stack);
        }
      }

      // ---- Styling control panel ----------------------------------------

      const DEFAULT_CONTROLS = {
        surface: "#1a472a",
        stripeColor: "#ffffff",
        stripeOpacity: 0.05,
        linesColor: "#ffffff",
        linesOpacity: 0.8,
        stripesEnabled: true,
        stripeCount: 12,
        goalType: "box",
        heatmapColormap: "default",
      };

      const controls = {
        surface: document.getElementById("ctrl-surface"),
        stripeColor: document.getElementById("ctrl-stripe"),
        stripeOpacity: document.getElementById("ctrl-stripe-opacity"),
        linesColor: document.getElementById("ctrl-lines"),
        linesOpacity: document.getElementById("ctrl-lines-opacity"),
        stripesEnabled: document.getElementById("ctrl-stripes-enabled"),
        stripeCount: document.getElementById("ctrl-stripe-count"),
        goalType: document.getElementById("ctrl-goal-type"),
        heatmapColormap: document.getElementById("ctrl-heatmap-colormap"),
      };

      /** "#rrggbb" + 0-1 opacity -> "rgba(r, g, b, a)", for compositing into a CSS var. */
      function hexToRgba(hex, opacity) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      }

      /** Pushes the colour controls' current values onto #grid's CSS variables — no re-render. */
      function applyColors() {
        grid.style.setProperty("--pitch-surface", controls.surface.value);
        grid.style.setProperty(
          "--pitch-stripe",
          hexToRgba(controls.stripeColor.value, Number(controls.stripeOpacity.value)),
        );
        grid.style.setProperty(
          "--pitch-lines",
          hexToRgba(controls.linesColor.value, Number(controls.linesOpacity.value)),
        );
      }

      /** Reads the appearance controls (baked into SVG shapes) and re-renders every panel. */
      function applyAppearance() {
        controls.stripeCount.disabled = !controls.stripesEnabled.checked;
        appearance.stripes = controls.stripesEnabled.checked
          ? Number(controls.stripeCount.value)
          : false;
        appearance.goalType = controls.goalType.value;
        renderAll();
      }

      /** Reads the heatmap colormap control and re-renders every panel. */
      function applyHeatmapColormap() {
        heatmapColormap = HEATMAP_COLORMAPS[controls.heatmapColormap.value];
        renderAll();
      }

      function resetControls() {
        controls.surface.value = DEFAULT_CONTROLS.surface;
        controls.stripeColor.value = DEFAULT_CONTROLS.stripeColor;
        controls.stripeOpacity.value = String(DEFAULT_CONTROLS.stripeOpacity);
        controls.linesColor.value = DEFAULT_CONTROLS.linesColor;
        controls.linesOpacity.value = String(DEFAULT_CONTROLS.linesOpacity);
        controls.stripesEnabled.checked = DEFAULT_CONTROLS.stripesEnabled;
        controls.stripeCount.value = String(DEFAULT_CONTROLS.stripeCount);
        controls.goalType.value = DEFAULT_CONTROLS.goalType;
        controls.heatmapColormap.value = DEFAULT_CONTROLS.heatmapColormap;
        applyColors();
        applyAppearance();
        applyHeatmapColormap();
      }

      for (const input of [controls.surface, controls.stripeColor, controls.linesColor]) {
        input.addEventListener("input", applyColors);
      }
      for (const input of [controls.stripeOpacity, controls.linesOpacity]) {
        input.addEventListener("input", applyColors);
      }
      for (const input of [controls.stripesEnabled, controls.stripeCount, controls.goalType]) {
        input.addEventListener("input", applyAppearance);
      }
      controls.heatmapColormap.addEventListener("input", applyHeatmapColormap);
      document.getElementById("ctrl-reset").addEventListener("click", resetControls);

      applyColors();
      renderAll();
    </script>
  </body>
</html>
