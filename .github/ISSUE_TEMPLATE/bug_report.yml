name: Bug report
description: Something renders wrong, crashes, or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal reproduction makes this dramatically easier to fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        A StackBlitz/CodeSandbox link, or the smallest code snippet that shows the problem —
        including the component, its props, and the shape of the data going in.
      render: tsx
    validations:
      required: true

  - type: dropdown
    id: pitch-type
    attributes:
      label: Pitch type
      options:
        - statsbomb
        - opta
        - uefa
        - not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "@pitchkit/react version"
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Framework and version, plus browser if relevant.
      placeholder: Next.js 16 (App Router), Chrome 141
    validations:
      required: false
