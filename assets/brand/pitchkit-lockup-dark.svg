<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48"
     role="img" aria-label="PitchKit">
  <title>PitchKit</title>
  <!-- The mark, scaled 48 -> 40 so it sits with a 32px wordmark. -->
  <g transform="translate(0 4) scale(0.83333)" fill="none" stroke="#34d399" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 9H7v30h10"/>
    <path d="M31 9h10v30H31"/>
    <path d="M24 9v9M24 30v9"/>
    <circle cx="24" cy="24" r="6"/>
  </g>
  <!-- System-font stack: GitHub renders this SVG as an <img>, which blocks
       webfonts, so the wordmark must fall back to fonts the viewer already has. -->
  <text x="54" y="35" font-size="32" font-weight="700" letter-spacing="-1"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <tspan fill="#e6edf3">Pitch</tspan><tspan fill="#34d399">Kit</tspan>
  </text>
</svg>
